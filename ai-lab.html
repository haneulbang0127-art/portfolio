<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>AI Lab · 조하늘</title>
<meta name="description" content="준비 중입니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700;800&family=Cormorant+Garamond:wght@700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

<header class="nav" id="nav">
  <div class="nav__inner">
    <nav class="nav__menu" aria-label="주요 메뉴">
      <a class="nav__link" href="main.html">HOME</a>
      <a class="nav__link" href="work.html">WORK</a>
      <a class="nav__link is-active" href="ai-lab.html" aria-current="page">AI Lab</a>
      <a class="nav__link" href="about.html">About</a>
    </nav>
    <button class="nav__burger" id="navBurger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="navPanel"><span></span><span></span></button>
  </div>

  <div class="nav__panel" id="navPanel" hidden>
    <a class="nav__panelLink" href="main.html">HOME</a>
    <a class="nav__panelLink" href="work.html">WORK</a>
    <a class="nav__panelLink" href="ai-lab.html" aria-current="page">AI Lab</a>
    <a class="nav__panelLink" href="about.html">About</a>
  </div>
</header>

<main class="soon">
  <p class="soon__label">AI LAB</p>
  <p class="soon__desc">AI로 만들어본 실험들을 모으는 중입니다.<br />곧 공개할게요.</p>
  <a class="soon__back" href="main.html">메인으로 돌아가기</a>
</main>

<script>
/* ===== 상단 네비게이션 (main.html과 같은 동작) ===== */
(function () {
  var nav = document.getElementById('nav');
  var burger = document.getElementById('navBurger');
  var panel = document.getElementById('navPanel');
  if (!nav) return;

  function onScroll() {
    nav.classList.toggle('is-stuck', window.scrollY > 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  if (!burger || !panel) return;

  function setOpen(open) {
    panel.hidden = !open;
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    nav.classList.toggle('is-open', open);
  }

  burger.addEventListener('click', function () { setOpen(panel.hidden); });

  document.addEventListener('click', function (e) {
    if (!panel.hidden && !nav.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) { setOpen(false); burger.focus(); }
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 767 && !panel.hidden) setOpen(false);
  });
})();
</script>

</body>
</html>
