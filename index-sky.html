<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>조하늘 · Product Designer</title>
<meta name="description" content="프로덕트 디자이너 조하늘의 포트폴리오. 궁금한 것을 물어보세요." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='34%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.55' stop-color='%23ffd9a8'/%3E%3Cstop offset='1' stop-color='%23ff9a6b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/sky.css" />
<link rel="stylesheet" href="assets/css/home.css" />
</head>
<body>

<!-- ===== 하늘 배경 (새벽 → 낮 → 노을 루프) ===== -->
<div class="sky" id="sky" aria-hidden="true">
  <div class="sky__layer sky__layer--dawn"></div>
  <div class="sky__layer sky__layer--day"></div>
  <div class="sky__layer sky__layer--dusk"></div>

  <div class="sky__clouds">
    <span class="cloud cloud--1"></span>
    <span class="cloud cloud--2"></span>
    <span class="cloud cloud--3"></span>
  </div>

  <canvas class="sky__canvas" id="skyCanvas"></canvas>

  <div class="sky__vignette"></div>
  <div class="sky__grain"></div>
</div>

<!-- ===== 헤더 ===== -->
<header class="nav" id="nav">
  <nav class="nav__menu" aria-label="주요 메뉴">
    <a class="nav__link is-active" href="index-sky.html" aria-current="page">Home</a>
    <a class="nav__link" href="work.html">Work</a>
    <a class="nav__link" href="ai-lab.html">AI Lab</a>
    <a class="nav__link" href="about.html">About</a>
  </nav>

  <a class="nav__cta" href="mailto:haneulbang@naver.com">
    Contact
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 12L12 4M12 4H6M12 4v6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <button class="nav__burger" id="navBurger" aria-label="메뉴 열기" aria-expanded="false">
    <span></span><span></span>
  </button>
</header>

<!-- ===== 메인 ===== -->
<main class="hero" id="hero">
  <div class="hero__inner">

    <section class="intro" id="intro">
      <p class="intro__eyebrow">
        <span class="intro__dot" aria-hidden="true"></span>
        <span id="skyPhaseLabel">새벽의 하늘</span>
      </p>
      <h1 class="intro__title">
        <span class="line">사용자의 하루에 긍정적인 경험을 남기는</span>
        <span class="line">프로덕트 디자이너 <strong>조하늘</strong>입니다.</span>
      </h1>
      <p class="intro__sub">
        저에 대해 궁금한 것을 아래에 물어봐 주세요.
      </p>
    </section>

    <!-- 대화 영역 -->
    <section class="chat" id="chat" aria-live="polite">
      <div class="chat__scroll" id="chatScroll">
        <ol class="chat__list" id="chatList"></ol>
      </div>
    </section>

    <!-- 입력 도크 -->
    <section class="dock" id="dock">
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="composer__reset" id="composerReset" aria-label="대화 초기화" hidden>
          <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 4v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <label class="sr-only" for="composerInput">하늘에게 질문하기</label>
        <textarea id="composerInput" class="composer__input" rows="1"
          placeholder="하늘에 대해 무엇이든 물어보세요" maxlength="300"></textarea>

        <button type="submit" class="composer__send" id="composerSend" aria-label="보내기" disabled>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 16V4M10 4L5 9M10 4l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <div class="chips" id="chips" role="group" aria-label="추천 질문">
        <button class="chip" type="button" data-q="이 기업에 적합한 인재인가요?">이 기업에 적합한 인재인가요?</button>
        <button class="chip" type="button" data-q="가장 큰 장점은 무엇인가요?">장점은?</button>
        <button class="chip" type="button" data-q="AI 활용 역량은 어느 정도인가요?">AI 활용 역량은?</button>
        <button class="chip" type="button" data-q="대표 프로젝트를 소개해 주세요.">대표 프로젝트는?</button>
        <button class="chip" type="button" data-q="협업할 때 어떤 스타일인가요?">협업 스타일은?</button>
      </div>

      <p class="dock__hint">답변은 하늘이 직접 작성한 자료를 기반으로 합니다.</p>
    </section>

  </div>

  <a class="scroll-cue" href="work.html" aria-label="Work 보러가기">
    <span>Selected Work</span>
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M10 16l-5-5M10 16l5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</main>

<script src="data/answers.js"></script>
<script src="assets/js/sky.js"></script>
<script src="assets/js/sky-gl.js"></script>
<script src="assets/js/chat.js"></script>
</body>
</html>
